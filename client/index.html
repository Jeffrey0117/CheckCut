<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="CheckCut - Curated video platform">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>CheckCut</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    // Apply the saved theme BEFORE first paint so there's no flash.
    // Default is LIGHT for first-time visitors (no saved preference).
    (function () {
      try {
        var saved = localStorage.getItem('checkcut-theme');
        var theme = saved === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-ck-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-ck-theme', 'light');
      }
    })();
  </script>
  <style>
    /* Instant loading screen - shows before JS loads.
       Colors are driven by the data-ck-theme attribute set above so a
       first visit (light) does not flash dark. */
    html[data-ck-theme='light'] body,
    html[data-ck-theme='light'] #app-loader { background-color: #fff; }
    html[data-ck-theme='dark'] body,
    html[data-ck-theme='dark'] #app-loader { background-color: #0f0f0f; }
    body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #fff;
      z-index: 99999;
    }
    .loader-logo {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .loader-logo .mee { color: #ef4444; }
    html[data-ck-theme='light'] .loader-logo .tube { color: #0f0f0f; }
    html[data-ck-theme='dark'] .loader-logo .tube { color: #fff; }
    .loader-logo .tube { color: #0f0f0f; }
    .loader-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(127,127,127,0.2);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading screen - visible immediately -->
  <div id="app-loader">
    <div class="loader-logo">
      <span class="mee">Check</span><span class="tube">Cut</span>
    </div>
    <div class="loader-spinner"></div>
  </div>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // Expose function to hide loader (called by Vue when mounted)
    window.hideMeetubeLoader = function() {
      var loader = document.getElementById('app-loader');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.transition = 'opacity 0.2s';
        setTimeout(function() { loader.remove(); }, 200);
      }
    };
    // Fallback: hide after 5 seconds if Vue fails to load
    setTimeout(function() { window.hideMeetubeLoader(); }, 5000);
  </script>
</body>
</html>
